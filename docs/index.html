<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Vehicle Maintenance Tracker</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <h1 id="title">Vehicle Tracker</h1>
    <button class="icon-btn" id="btn-settings" aria-label="Settings and backup">⚙</button>
  </div>
</header>
<nav class="nav" id="nav" aria-label="Main">
  <button data-view="home"><span class="ni">🏠</span><span>Home</span></button>
  <button data-view="vehicles"><span class="ni">🚚</span><span>Vehicles</span></button>
  <button data-view="service"><span class="ni">🔧</span><span>Service</span></button>
  <button data-view="expenses"><span class="ni">💵</span><span>Expenses</span></button>
  <button data-view="reports"><span class="ni">📊</span><span>Reports</span></button>
</nav>
<main id="app" tabindex="-1"><p class="muted pad">Loading…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="js/core.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/db.js"></script>
<script src="js/updater.js"></script>
<script src="js/app.js"></script>
</body>
</html>
